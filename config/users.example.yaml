# Who may sign in. Copy to config/users.yaml (gitignored) and put the real
# address in. username: email — nothing else belongs in this file.
#
# No passwords, and no password hashes: the only way in is a one-time code sent
# to the address below, so this file is a routing table, not a credential store.
#
# The username becomes a URL path (anywr.live/<username>/) and the value of the
# X-Auth-User header the gateway routes on, so it is restricted to lowercase
# letters, digits, '-' and '_', up to 40 characters. Two usernames may not share
# an address — the service refuses to start rather than guess which one a code
# signs you in as.
asanbl4: you@example.com
