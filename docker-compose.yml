services:
  soak:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    env_file: config/.env
    # Chrome's own sandbox needs to create namespaces; Docker's default seccomp
    # profile forbids that. This keeps the sandbox on instead of --no-sandbox.
    security_opt: [seccomp=unconfined]
    shm_size: 1gb
    stop_grace_period: 60s
    ports: ["127.0.0.1:6080:6080"]   # noVNC, reachable only through the SSH tunnel
    volumes:
      - profile:/profile
      - ./data:/data
      # Code is mounted, not only baked in, so a probe fix after T0 needs no
      # rebuild -- a rebuild restarts Chrome and would be an unplanned cycle.
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./tests:/app/tests:ro

  # A second, general-purpose browser: same image, its own profile and data,
  # so nothing done here touches the soak experiment.
  work:
    build: { context: ., dockerfile: docker/Dockerfile }
    restart: unless-stopped
    env_file: config/.env
    environment: { CDP_PROXY: "1" }
    security_opt: [seccomp=unconfined]
    shm_size: 1gb
    stop_grace_period: 60s
    ports: ["127.0.0.1:6081:6080"]   # noVNC over the SSH tunnel: ssh -L 6081:localhost:6081 soak
    volumes:
      - work-profile:/profile
      - work-data:/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro

  # Playwright MCP server. Shares soak's network namespace because soak's
  # Chrome only listens on localhost and soak must not be rebuilt mid-soak.
  mcp:
    build: { context: ., dockerfile: docker/mcp.Dockerfile }
    restart: unless-stopped
    network_mode: "service:soak"
    environment: { VIEW_BASE: "https://mcp.xmzr.dev/ws/view" }
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
      - ./config:/app/config:ro

  # M1 digest kernel: view / click / fill / select / session_status over one
  # browser. Deliberately NOT
  # network_mode: service:soak -- it talks to work over the default network, so
  # nothing here can reach the experiment's Chrome. No /data mount either: with
  # no soak.db in reach it cannot write AGENT_ACTION even by accident.
  # No published port; it is spoken to over `docker compose exec` on stdio.
  kernel:
    build: { context: ., dockerfile: docker/mcp.Dockerfile }
    restart: unless-stopped
    env_file: config/.env            # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    environment:
      KERNEL_CDP: "work:9223"
      KERNEL_STATE_FILE: "/state/handoff.json"
      KERNEL_VIEWER_URL: "https://mcp.xmzr.dev/ws/live/"
      KERNEL_ADAPTERS_DIR: "/state/adapters"   # promoted tools; /state is the only writable path
    command: ["python", "-m", "kernel.server"]
    volumes:
      - ./src:/app/src:ro
      - ./state:/state               # the handoff record, shared with `control`

  # The Done button. Its own process because the MCP server runs on stdio and a
  # `docker compose exec` pipe cannot receive an HTTP request. No browser, no
  # /data, no CDP: it reads and writes one file and serves one page.
  control:
    build: { context: ., dockerfile: docker/mcp.Dockerfile }
    restart: unless-stopped
    environment:
      KERNEL_STATE_FILE: "/state/handoff.json"
      KERNEL_CONTROL_PORT: "8787"
      # Resolved by the browser against mcp.xmzr.dev, not inside the container,
      # so it carries the gateway's /ws prefix.
      KERNEL_NOVNC_URL: "/ws/view/work/vnc.html"
    command: ["python", "-m", "kernel.control"]
    volumes:
      - ./src:/app/src:ro
      - ./state:/state

  # Front door for mcp-hub's Caddy (mcp.xmzr.dev/ws/*). Bound to the VPC
  # address only; no firewall rule opens 8090 to the internet.
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: config/gateway.env
    ports: ["10.170.0.6:8090:80"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  profile:
  work-profile:
  work-data:
