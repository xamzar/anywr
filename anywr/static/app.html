<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anywr</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0 auto; max-width: 720px; padding: 16px; font: 15px/1.5 system-ui, sans-serif; }
  button, input { font: inherit; padding: 6px 10px; }
  input { width: 100%; box-sizing: border-box; margin: 4px 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .mono, code, pre { font-family: ui-monospace, monospace; font-size: 13px; }
  .auth { max-width: 320px; margin: 15vh auto 0; }
  .err { color: #dc2626; min-height: 1.5em; }
  .secret { word-break: break-all; margin: 12px 0; }
  body:has(#dash:not([hidden])) { max-width: none; padding: 0; height: 100dvh; }
  #dash { height: 100%; display: flex; flex-direction: column; }
  #dash .row { padding: 4px 8px; }
  .viewer { flex: 1; width: 100%; border: 0; border-top: 1px solid #8884; }
  dialog { max-width: 520px; }
  pre { white-space: pre-wrap; word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<section id="auth" class="auth" hidden>
  <form id="f-signup" hidden>
    <label for="su-name">Username</label>
    <input id="su-name" autocomplete="username" pattern="[a-z0-9][a-z0-9-]{1,28}[a-z0-9]" title="3-30 characters: a-z, 0-9, dashes" required>
    <button>Sign up</button> <a href="/">Sign in</a>
  </form>
  <form id="f-find" hidden>
    <label for="find-name">Username</label><input id="find-name" autocomplete="username" required>
    <button>Sign in</button> <a href="/signup">Sign up</a>
  </form>
  <form id="f-login" hidden>
    <p class="mono" id="login-title"></p>
    <button>Email me a code</button>
  </form>
  <p id="nouser" hidden><span id="nouser-name" class="mono"></span> doesn't exist. <a href="/signup">Sign up</a></p>
  <p class="err" id="auth-err"></p>
</section>

<main id="dash" hidden>
  <div class="row">
    <span id="who" class="mono grow"></span>
    <button id="agent-make">Generate link</button>
    <button id="guide">Guide</button>
    <button id="logout">Sign out</button>
  </div>
  <iframe id="viewer" class="viewer" title="Cloud browser"></iframe>
</main>

<dialog id="guide-dlg">
  <div id="agent-new" hidden>
    <div class="secret mono" id="agent-url"></div>
    <button id="copy">Copy</button>
  </div>
  <p><b>1.</b> Sign in to your sites in the browser.</p>
  <p><b>2.</b> Generate link (a new one revokes the old).</p>
  <p><b>3.</b> claude.ai: Settings → Connectors → Add custom connector → paste it.<br>
     Claude Code:</p>
  <pre id="agent-cli">claude mcp add --transport http anywr &lt;link&gt;</pre>
  <form method="dialog"><button>Close</button></form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: "same-origin", headers: { "content-type": "application/json" }, ...opts });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
};
let beat = null;
const path = decodeURIComponent(location.pathname.slice(1)).toLowerCase();
const show = (id) => { $("auth").hidden = false; $(id).hidden = false; };
const fail = (err) => { $("auth-err").textContent = err.message; };

// Cloudflare Access proves the email and sends the browser back to /auth/callback.
async function startLogin(body) {
  try { location.href = (await api("/api/login", { method: "POST", body: JSON.stringify(body) })).url; }
  catch (err) { fail(err); }
}
$("f-signup").onsubmit = (e) => { e.preventDefault(); startLogin({ username: $("su-name").value, signup: true }); };
$("f-login").onsubmit = (e) => { e.preventDefault(); startLogin({ username: path }); };
$("f-find").onsubmit = (e) => { e.preventDefault(); location.href = "/" + $("find-name").value.trim().toLowerCase(); };
$("su-name").oninput = (e) => { e.target.value = e.target.value.toLowerCase(); };
$("logout").onclick = async () => { await api("/api/logout", { method: "POST" }); location.href = "/"; };
$("guide").onclick = () => $("guide-dlg").showModal();

function openViewer() {
  // KasmVNC web client. /view/* is authorised by this session cookie; Caddy picks your container.
  $("viewer").src = "/view/index.html?path=view/websockify&autoconnect=1&resize=scale&reconnect=1";
  clearInterval(beat);
  beat = setInterval(() => api("/api/browser/touch", { method: "POST" }).catch(() => {}), 60000);
}

$("agent-make").onclick = async () => {
  if (!confirm("Any existing link stops working. Continue?")) return;
  const { url } = await api("/api/agent", { method: "POST" });
  $("agent-url").textContent = url;
  $("agent-cli").textContent = `claude mcp add --transport http anywr ${url}`;
  $("agent-new").hidden = false;
  $("guide-dlg").showModal();
};
$("copy").onclick = () => navigator.clipboard.writeText($("agent-url").textContent).then(() => $("copy").textContent = "Copied");

async function load() {
  const s = await api("/api/session");
  const u = s.user;
  if (path === "signup") return show("f-signup");
  if (path === "" || path === "login") return u ? location.replace("/" + u.username) : show("f-find");
  if (!u || u.username !== path) {
    if (!(await api("/api/user/" + encodeURIComponent(path))).exists) {
      $("nouser-name").textContent = path; return show("nouser");
    }
    $("login-title").textContent = path;
    if (u) $("auth-err").textContent = `Signed in as ${u.username}; continuing switches account.`;
    return show("f-login");
  }
  $("dash").hidden = false;
  $("who").textContent = u.username;
  document.title = u.username;
  openViewer();
}
load();
</script>
</body>
</html>
